name: 🧪 Push Checks & Preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  slug:
    name: 🏷️ Compute branch slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Compute branch slug
        id: slug
        run: |
          slug=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typegen
      - run: npm run lint:prepush

  typecheck:
    name: 🔎 Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typegen
      - run: npm run typecheck

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm test

  neon:
    name: 🧬 Setup Neon branch
    runs-on: ubuntu-latest
    needs: [slug, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - name: Create Neon branch
        id: neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview-${{ needs.slug.outputs.slug }}
          parent_branch: main
          role: learning-platform_owner
          database: learning-platform
          prisma: true
          api_key: ${{ env.NEON_API_KEY }}

      - name: Run Prisma migrations
        run: npx prisma@6.12.0 migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}
          DIRECT_URL: ${{ steps.neon_branch.outputs.db_url }}

  deploy:
    name: 🧩 Deploy Preview
    runs-on: ubuntu-latest
    needs: [slug, neon]
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Fetch Neon connection string
        id: neon_branch_deploy
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview-${{ needs.slug.outputs.slug }}
          parent_branch: main
          role: learning-platform_owner
          database: learning-platform
          prisma: true
          api_key: ${{ env.NEON_API_KEY }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }} \
          --build-env DATABASE_URL='${{ steps.neon_branch_deploy.outputs.db_url_pooled || steps.neon_branch_deploy.outputs.db_url }}' \
          --build-env DIRECT_URL='${{ steps.neon_branch_deploy.outputs.db_url }}'

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes \
            --env DATABASE_URL='${{ steps.neon_branch_deploy.outputs.db_url_pooled || steps.neon_branch_deploy.outputs.db_url }}' \
            --env DIRECT_URL='${{ steps.neon_branch_deploy.outputs.db_url }}' \
            | tail -n 1)
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Alias staging deployment
        run: vercel alias set ${{ steps.vercel_deploy.outputs.url }} hiphop-staging.plumblearning.com --token=${{ secrets.VERCEL_TOKEN }}

      - name: Save deploy URL for PR workflow
        run: echo "${{ steps.vercel_deploy.outputs.url }}" > deploy-url.txt

      - name: Upload deploy URL
        uses: actions/upload-artifact@v7
        with:
          name: deploy-url
          path: deploy-url.txt
          retention-days: 7
