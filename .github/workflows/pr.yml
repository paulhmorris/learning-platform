name: 🧪 PR to Main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  slug:
    name: 🏷️ Compute branch slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Compute branch slug
        id: slug
        run: |
          slug=$(echo "${HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_REF: ${{ github.head_ref }}

  schema-diff:
    name: 🧬 Post schema diff
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    needs: [slug]
    steps:
      - name: Post schema diff
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          compare_branch: preview-${{ needs.slug.outputs.slug }}
          base_branch: main
          database: learning-platform
          api_key: ${{ env.NEON_API_KEY }}

  e2e:
    name: 🎭 Test e2e
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    needs: [slug]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel env pull .env --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download deploy URL from push workflow
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: push.yml
          branch: ${{ github.head_ref }}
          name: deploy-url
          path: .

      - name: Read deploy URL
        id: deploy_url
        run: echo "url=$(cat deploy-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Fetch Neon connection string
        id: neon_branch_e2e
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview-${{ needs.slug.outputs.slug }}
          parent_branch: main
          role: learning-platform_owner
          database: learning-platform
          prisma: true
          api_key: ${{ env.NEON_API_KEY }}

      - name: Run e2e Tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy_url.outputs.url }}
          LOG_LEVEL: "error"
          DIRECT_URL: ${{ steps.neon_branch_e2e.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon_branch_e2e.outputs.db_url_pooled || steps.neon_branch_e2e.outputs.db_url }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  cleanup:
    name: 🧹 Delete Neon Branch
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    needs: [slug]
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview-${{ needs.slug.outputs.slug }}
          api_key: ${{ env.NEON_API_KEY }}
