name: 🚢 Deploy Production
env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Migrate Database
        run: npx prisma@6.12.0 migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Set commit SHA
        run: npx @railway/cli@5 variables --service web --skip-deploys --set "GIT_COMMIT_SHA=${{ github.sha }}"

      - name: Deploy to Railway
        run: npx @railway/cli@5 up --service web --ci --message "${{ github.sha }}"

  trigger:
    name: 🔫 Deploy Trigger
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Trigger Deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          npx trigger.dev@4.5.16 deploy
